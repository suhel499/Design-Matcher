name: Build & Package Design Matcher (Windows & macOS)

on:
  push:
    branches: [ "Design-Macher-Dev", "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller pillow
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Compile application with PyInstaller
        run: pyinstaller --clean -y design_matcher.spec

      - name: Compile Windows Installer with Inno Setup
        run: |
          $iscc = if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          } else {
            "iscc"
          }
          Write-Host "Using Inno Setup compiler at: $iscc"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup compilation failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Upload Windows Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesignMatcher_Windows_Setup
          path: Output/DesignMatcher_Setup_*.exe
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: Build macOS DMG (.dmg)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller pillow
          pip install -r requirements.txt

      - name: Package macOS App & DMG
        run: |
          chmod +x package_macos.sh
          ./package_macos.sh

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DesignMatcher_macOS_DMG
          path: dist/DesignMatcher_*.dmg
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish Release to GitHub
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows Setup Artifact
        uses: actions/download-artifact@v4
        with:
          name: DesignMatcher_Windows_Setup
          path: release_assets

      - name: Download macOS DMG Artifact
        uses: actions/download-artifact@v4
        with:
          name: DesignMatcher_macOS_DMG
          path: release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
