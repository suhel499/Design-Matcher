name: Build & Package Design Matcher (Windows & macOS)

on:
  push:
    branches: [ "Design-Macher-Dev", "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      build_windows:
        description: "Build Windows Installer (.exe)"
        type: boolean
        default: true
      build_macos:
        description: "Build macOS DMG (.dmg)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer (.exe)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_windows }}
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller pillow pydantic pydantic-core scipy
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Pre-cache DINOv2 model weights for offline bundling
        shell: pwsh
        run: |
          python -c "from transformers import AutoImageProcessor, AutoModel; from pathlib import Path; p = Path('models/dinov2-small'); p.mkdir(parents=True, exist_ok=True); print('Downloading DINOv2 to models/dinov2-small...'); AutoImageProcessor.from_pretrained('facebook/dinov2-small').save_pretrained(p); AutoModel.from_pretrained('facebook/dinov2-small').save_pretrained(p); print('Model pre-cached successfully.')"

      - name: Compile application with PyInstaller
        run: pyinstaller --clean -y design_matcher.spec

      - name: Compile Windows Installer with Inno Setup
        run: |
          $iscc = if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          } else {
            "iscc"
          }
          Write-Host "Using Inno Setup compiler at: $iscc"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup compilation failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Publish Installer to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tagName = if ("${{ github.ref }}".StartsWith("refs/tags/v")) { "${{ github.ref_name }}" } else { "latest-build" }
          $title = if ("${{ github.ref }}".StartsWith("refs/tags/v")) { "Release $tagName" } else { "Design Matcher (Latest Build - ${{ github.ref_name }})" }
          
          # Ensure release exists
          & gh release view $tagName >$null 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating release $tagName..."
            & gh release create $tagName --title "$title" --notes "Automated release build from commit \`${{ github.sha }}\`."
          }

          $files = Get-ChildItem Output/DesignMatcher_Setup_*.exe
          if ($files) {
            foreach ($f in $files) {
              Write-Host "Uploading $($f.FullName) to GitHub Release $tagName..."
              & gh release upload $tagName $f.FullName --clobber
            }
          } else {
            Write-Error "No setup executable found in Output/"
            exit 1
          }

      - name: Upload Windows Setup Artifact (Backup)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: DesignMatcher_Windows_Setup
          path: Output/DesignMatcher_Setup_*.exe
          if-no-files-found: ignore
          retention-days: 7

  build-macos:
    name: Build macOS DMG (.dmg)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_macos }}
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller pillow pydantic pydantic-core scipy
          pip install -r requirements.txt

      - name: Pre-cache DINOv2 model weights for offline bundling
        run: |
          python3 -c "from transformers import AutoImageProcessor, AutoModel; from pathlib import Path; p = Path('models/dinov2-small'); p.mkdir(parents=True, exist_ok=True); print('Downloading DINOv2 to models/dinov2-small...'); AutoImageProcessor.from_pretrained('facebook/dinov2-small').save_pretrained(p); AutoModel.from_pretrained('facebook/dinov2-small').save_pretrained(p); print('Model pre-cached successfully.')"

      - name: Package macOS App & DMG
        run: |
          chmod +x package_macos.sh
          ./package_macos.sh

      - name: Publish DMG to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            TITLE="Release $TAG_NAME"
          else
            TAG_NAME="latest-build"
            TITLE="Design Matcher (Latest Build - ${{ github.ref_name }})"
          fi

          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Creating release $TAG_NAME..."
            gh release create "$TAG_NAME" --title "$TITLE" --notes "Automated release build from commit \`${{ github.sha }}\`." || true
          fi

          DMG_FILES=(dist/DesignMatcher_*.dmg)
          if [ -f "${DMG_FILES[0]}" ]; then
            for f in "${DMG_FILES[@]}"; do
              echo "Uploading $f to GitHub Release $TAG_NAME..."
              gh release upload "$TAG_NAME" "$f" --clobber
            done
          else
            echo "Error: No DMG file found in dist/"
            exit 1
          fi

      - name: Upload macOS DMG Artifact (Backup)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: DesignMatcher_macOS_DMG
          path: dist/DesignMatcher_*.dmg
          if-no-files-found: ignore
          retention-days: 7
