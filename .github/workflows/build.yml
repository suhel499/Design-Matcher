name: Build & Package Design Matcher (Windows & macOS)

on:
  push:
    branches: [ "Design-Macher-Dev", "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init-release:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ensure GitHub Release Exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
            PRERELEASE_FLAG=""
            TITLE="Release $TAG_NAME"
          else
            TAG_NAME="latest-build"
            PRERELEASE_FLAG="--prerelease"
            TITLE="Design Matcher (Latest Build - ${{ github.ref_name }})"
          fi

          echo "Target tag: $TAG_NAME"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists. Updating details..."
            gh release edit "$TAG_NAME" --title "$TITLE" --notes "Automated CI build from branch \`${{ github.ref_name }}\` (commit \`${{ github.sha }}\`)." || true
          else
            echo "Creating release $TAG_NAME..."
            gh release create "$TAG_NAME" \
              --title "$TITLE" \
              --notes "Automated CI build from branch \`${{ github.ref_name }}\` (commit \`${{ github.sha }}\`)." \
              $PRERELEASE_FLAG
          fi

  build-windows:
    name: Build Windows Installer (.exe)
    needs: [init-release]
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller pillow
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Compile application with PyInstaller
        run: pyinstaller --clean -y design_matcher.spec

      - name: Compile Windows Installer with Inno Setup
        run: |
          $iscc = if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\ISCC.exe") {
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          } else {
            "iscc"
          }
          Write-Host "Using Inno Setup compiler at: $iscc"
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Inno Setup compilation failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      # Publish directly to GitHub Release (bypasses Actions artifact 500MB storage quota)
      - name: Upload Installer to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tagName = if ("${{ github.ref }}".StartsWith("refs/tags/v")) { "${{ github.ref_name }}" } else { "latest-build" }
          $files = Get-ChildItem Output/DesignMatcher_Setup_*.exe
          if ($files) {
            foreach ($f in $files) {
              Write-Host "Uploading $($f.FullName) to GitHub Release $tagName..."
              gh release upload $tagName $f.FullName --clobber
            }
          } else {
            Write-Error "No setup executable found in Output/"
            exit 1
          }

      # Optional CI Artifact backup (continue-on-error prevents failures if quota is full)
      - name: Upload Windows Setup Artifact (Backup)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: DesignMatcher_Windows_Setup
          path: Output/DesignMatcher_Setup_*.exe
          if-no-files-found: ignore
          retention-days: 1

  build-macos:
    name: Build macOS DMG (.dmg)
    needs: [init-release]
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel pyinstaller pillow
          pip install -r requirements.txt

      - name: Package macOS App & DMG
        run: |
          chmod +x package_macos.sh
          ./package_macos.sh

      # Publish directly to GitHub Release (bypasses Actions artifact 500MB storage quota)
      - name: Upload DMG to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="latest-build"
          fi
          DMG_FILES=(dist/DesignMatcher_*.dmg)
          if [ -f "${DMG_FILES[0]}" ]; then
            for f in "${DMG_FILES[@]}"; do
              echo "Uploading $f to GitHub Release $TAG_NAME..."
              gh release upload "$TAG_NAME" "$f" --clobber
            done
          else
            echo "Error: No DMG file found in dist/"
            exit 1
          fi

      # Optional CI Artifact backup (continue-on-error prevents failures if quota is full)
      - name: Upload macOS DMG Artifact (Backup)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: DesignMatcher_macOS_DMG
          path: dist/DesignMatcher_*.dmg
          if-no-files-found: ignore
          retention-days: 1
